[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ltx-core"
version = "1.0.0+gopex"
description = "LTX-2 core model and inference (Gopex fork with streaming / batch-split)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch~=2.7",
    "torchaudio",
    "einops",
    "numpy",
    "transformers>=4.52",
    "safetensors",
    "accelerate",
    "scipy>=1.14",
]

[tool.setuptools.packages.find]
where = ["src"]
