[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ltx-pipelines"
version = "1.0.0+gopex"
description = "LTX-2 inference pipelines (Gopex fork: blocks-based HQ + kino utils)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ltx-core",
    "av",
    "pillow",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]
